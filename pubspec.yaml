name: kafeproje
description: A Flutter app for discovering and comparing cafes in Istanbul.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # State Management
  riverpod: ^2.3.0
  flutter_riverpod: ^2.3.0
  
  # Navigation
  go_router: ^7.0.0
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # HTTP & Serialization
  http: ^1.1.0
  
  # UI & Icons
  material_design_icons_flutter: ^7.0.7000
  google_maps_flutter: ^2.5.0
  
  # Utils
  intl: ^0.20.0
  uuid: ^4.0.0
  geolocator: ^9.0.0
  image_picker: ^1.1.2
  
  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  package_info_plus: ^8.0.0
  connectivity_plus: ^7.0.0
  firebase_core: ^4.6.0
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.1.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/data/
